name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # The typecheck needs declarations Claude Code writes only when a session loads the mod, so CI validates
      # the plugin instead: the manifest, the marketplace, the hooks file, and that every hook module parses.
      - run: npx -y @anthropic-ai/claude-code plugin validate .
      # The hooks against the engine itself: tests/engine/*.test.tsx.
      - run: npx -y @anthropic-ai/claude-code plugin test .
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The Windows player as it runs, under Windows PowerShell 5.1: the script parses and its mixer
      # helper compiles. A compile error would otherwise show only as a line in the player's log.
      - run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\player\win.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs; exit 1 }
          $src = [regex]::Match((Get-Content player\win.ps1 -Raw), "Add-Type -TypeDefinition @'\r?\n([\s\S]*?)\r?\n'@").Groups[1].Value
          if (-not $src) { 'no mixer source found'; exit 1 }
          Add-Type -TypeDefinition $src
          if (-not ('SpeakAudio.Mixer' -as [type])) { exit 1 }
        shell: powershell
