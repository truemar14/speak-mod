name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # The typecheck needs declarations Claude Code writes only when a session loads the mod, so CI validates
      # the plugin instead: the manifest, the marketplace, the hooks file, and that every hook module parses.
      - run: npx -y @anthropic-ai/claude-code plugin validate .
      # The hooks against the engine itself: tests/engine/*.test.tsx.
      - run: npx -y @anthropic-ai/claude-code plugin test .
